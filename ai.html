<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LM STUDY AI</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="ai-header">

    <div class="ai-brand">
        🤖 <strong>LM STUDY AI</strong>
    </div>

    <nav>

        <a href="index.html">Accueil</a>
        <a href="cours.html">Cours</a>
        <a href="exercices.html">Exercices</a>
        <a href="quiz.html">Quiz</a>

    </nav>

</header>


<main class="ai-page">

    <section class="ai-container">

        <div class="ai-title">

            <div class="ai-big-icon">
                🤖
            </div>

            <h1>LM STUDY AI</h1>

            <p>
                Ton assistant pédagogique intelligent
            </p>

        </div>


        <div id="chat" class="chat">

            <div class="message ai">

                <strong>🤖 LM STUDY AI</strong>

                <p>
                    Bonjour 👋 ! Je suis ton assistant.
                    Pose-moi une question sur tes cours.
                </p>

            </div>

        </div>


        <div class="ai-input">

            <input
                id="aiMessage"
                type="text"
                placeholder="Pose ta question..."
                autocomplete="off"
            >

            <button id="sendButton">
                Envoyer 🚀
            </button>

        </div>

    </section>

</main>


<script src="js/ai.js"></script>

</body>

</html>
